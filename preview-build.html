<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>How We Build — full rebuild</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        background: #eceae5; color: #1d2733;
        font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      header {
        flex: 0 0 auto; background: #fff; border-bottom: 1px solid rgba(29,39,51,.14);
        padding: 9px 14px; display: flex; flex-direction: column; gap: 6px;
      }
      .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
      button {
        font: inherit; font-size: 11.5px; padding: 3px 8px; border-radius: 999px;
        border: 1px solid rgba(29,39,51,.18); background: #fff; color: inherit; cursor: pointer;
      }
      button:hover { border-color: #c8332b; color: #c8332b; }
      button[aria-pressed="true"] { background: #1d2733; border-color: #1d2733; color: #fff; }
      input[type=range] { flex: 1 1 320px; min-width: 180px; }
      .readout { font-variant-numeric: tabular-nums; font-size: 11.5px; color: #55606c; min-width: 300px; }
      .hint { font-size: 11.5px; color: #6b7683; margin: 0; }
      main { flex: 1 1 auto; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 14px; }
      .frame {
        background: #fff; border: 1px solid rgba(29,39,51,.14); border-radius: 10px;
        overflow: hidden; box-shadow: 0 10px 30px rgba(20,24,29,.10);
      }
      svg { display: block; }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <h1>How We Build — full rebuild</h1>
        <button id="play">Play</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" />
        <span class="readout" id="readout"></span>
      </div>
      <div class="row" id="beats"></div>
      <div class="row" id="frames"></div>
      <p class="hint">
        One isometric world, generated in code, with a camera that pans, pushes
        in and cuts away the near walls to get inside. Drag to hold any moment.
      </p>
    </header>
    <main><div class="frame" id="frame"><svg id="scene"></svg></div></main>

    <script>
      (function () {
        "use strict";

        /* ==========================================================
           1. PROJECTION
           World is in feet. x runs along the front of the house, y runs
           back into the lot, z is up. The nearest corner is the one with
           the largest (x + y), which is also the painter's-order rule:
           anything with a bigger (x + y) is drawn later.
           ========================================================== */
        var COS30 = Math.cos(Math.PI / 6), U = 7.2;
        function px(x, y, z) { return [(x - y) * COS30 * U, ((x + y) * 0.5 - (z || 0)) * U]; }
        function pt(x, y, z) { var p = px(x, y, z); return p[0] + "," + p[1]; }

        var NS = "http://www.w3.org/2000/svg";
        function mk(tag, a, p) {
          var e = document.createElementNS(NS, tag);
          if (a) for (var k in a) if (a[k] != null) e.setAttribute(k, a[k]);
          if (p) p.appendChild(e);
          return e;
        }
        function grp(a, p) { return mk("g", a, p); }

        /* Three visible faces, consistently lit. That lighting is most of
           what makes a flat polygon read as a solid. */
        function box(parent, x, y, z, dx, dy, dz, c, cls) {
          var g = grp({ class: cls || null }, parent);
          mk("polygon", { points: [pt(x + dx, y, z), pt(x + dx, y + dy, z), pt(x + dx, y + dy, z + dz), pt(x + dx, y, z + dz)].join(" "), fill: c.r }, g);
          mk("polygon", { points: [pt(x, y + dy, z), pt(x + dx, y + dy, z), pt(x + dx, y + dy, z + dz), pt(x, y + dy, z + dz)].join(" "), fill: c.l }, g);
          mk("polygon", { points: [pt(x, y, z + dz), pt(x + dx, y, z + dz), pt(x + dx, y + dy, z + dz), pt(x, y + dy, z + dz)].join(" "), fill: c.t }, g);
          g.__d = x + y;                       // depth key: bigger is nearer
          g.__z = z;                           // tie-break for stacked boxes
          return g;
        }
        function quad(parent, a, b, c, d, fill, cls) {
          return mk("polygon", { points: [a, b, c, d].join(" "), fill: fill, class: cls || null }, parent);
        }
        function shade(hex, f) {              // simple multiply, for face variants
          var n = parseInt(hex.slice(1), 16);
          var r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
          return "#" + ((1 << 24) + (Math.min(255, r) << 16) + (Math.min(255, g) << 8) + Math.min(255, b)).toString(16).slice(1);
        }
        function mat(hex) { return { t: hex, l: shade(hex, .88), r: shade(hex, .74) }; }

        var C = {
          grass: mat("#cfd6c4"), dirt: mat("#a08a6f"), pit: mat("#6d5a44"),
          steel: mat("#d3d8dd"), red: mat("#d94a3f"), ink: mat("#39424e"),
          wood: mat("#e2cfa8"), lumber: mat("#e8d5ac"), cmu: mat("#c9c7c0"),
          conc: mat("#cfcdc6"), sheath: mat("#d8c294"), stucco: mat("#efeee9"),
          gyp: mat("#f2f2ef"), batt: mat("#e7b9a8"), tile: mat("#dcdad3"),
          copper: mat("#c98a5b"), roof: mat("#4a5360")
        };

        var scene = document.getElementById("scene"), world = grp({ id: "world" }, scene);

        /* ==========================================================
           2. THE HOUSE, AS DATA
           Every later scene is derived from this: block courses, joists,
           studs with their kings and jacks, sheathing, windows, drywall.
           Change the footprint and all of it follows.
           ========================================================== */
        var FP = { x0: 0, y0: 0, x1: 40, y1: 28 };
        var FH = 10, FLOORS = 3, WT = 1;              // floor height, storeys, wall thickness
        var Z = [0, FH, FH * 2, FH * 3];              // slab top, then each floor level
        var FDN_TOP = 0, FDN_BOT = -8, FTG = -9;

        // Openings, per storey, on the two walls the camera can see.
        function frontOpenings(fl) {
          var o = [];
          [7, 20, 33].forEach(function (cx) {
            if (fl === 0 && cx === 20) o.push({ a: 18, b: 22, sill: 0, head: 7.6, door: true });
            else o.push({ a: cx - 2.5, b: cx + 2.5, sill: 3.4, head: 8.0 });
          });
          return o;
        }
        function rightOpenings() { return [{ a: 7, b: 11, sill: 3.4, head: 8.0 }, { a: 18, b: 22, sill: 3.4, head: 8.0 }]; }

        // axis 'x' runs along x at y = at; axis 'y' runs along y at x = at.
        var WALLS = [
          { id: "front", axis: "x", at: FP.y1 - WT, from: FP.x0, to: FP.x1, near: true, op: frontOpenings },
          { id: "right", axis: "y", at: FP.x1 - WT, from: FP.y0, to: FP.y1, near: true, op: rightOpenings },
          { id: "back", axis: "x", at: FP.y0, from: FP.x0, to: FP.x1, near: false, op: function () { return []; } },
          { id: "left", axis: "y", at: FP.x0, from: FP.y0, to: FP.y1, near: false, op: function () { return []; } }
        ];
        function place(w, pos, z, len, thick, h) {
          return w.axis === "x" ? [pos, w.at, z, len, thick, h] : [w.at, pos, z, thick, len, h];
        }

        /* ==========================================================
           3. BUILDING THE SCENE, far to near
           ========================================================== */
        var L = {};                                   // layer groups
        ["ground", "pit", "footing", "cmu", "slab", "floorsys", "framing",
         "interior", "sheath", "stucco", "windows", "roof", "site", "figures"]
          .forEach(function (n) { L[n] = grp({ id: "L-" + n }, world); });

        /* ---------- ground ---------- */
        var LOT = { x0: -18, y0: -14, x1: 66, y1: 50 };
        quad(L.ground, pt(LOT.x0, LOT.y0, 0), pt(LOT.x1, LOT.y0, 0), pt(LOT.x1, LOT.y1, 0), pt(LOT.x0, LOT.y1, 0), C.grass.t);
        var gridG = grp({ stroke: "rgba(29,39,51,.06)", "stroke-width": ".8", fill: "none" }, L.ground);
        for (var gx = LOT.x0; gx <= LOT.x1; gx += 8) mk("line", { x1: px(gx, LOT.y0, 0)[0], y1: px(gx, LOT.y0, 0)[1], x2: px(gx, LOT.y1, 0)[0], y2: px(gx, LOT.y1, 0)[1] }, gridG);
        for (var gy = LOT.y0; gy <= LOT.y1; gy += 8) mk("line", { x1: px(LOT.x0, gy, 0)[0], y1: px(LOT.x0, gy, 0)[1], x2: px(LOT.x1, gy, 0)[0], y2: px(LOT.x1, gy, 0)[1] }, gridG);
        quad(L.ground, pt(LOT.x0, 44, 0), pt(LOT.x1, 44, 0), pt(LOT.x1, 50, 0), pt(LOT.x0, 50, 0), "#b7babc");   // road, near side
        var walkG = quad(L.ground, pt(17, FP.y1, .02), pt(23, FP.y1, .02), pt(23, 44, .02), pt(17, 44, .02), "#cfcdc6");
        walkG.style.opacity = 0;

        /* A soft ground shadow. The single cheapest thing that stops a
           building looking pasted onto the grass. */
        var aoDefs = mk("defs", null, scene);
        var rg = mk("radialGradient", { id: "aoGrad", cx: "50%", cy: "50%", r: "50%" }, aoDefs);
        mk("stop", { offset: "0%", "stop-color": "rgba(29,39,51,.30)" }, rg);
        mk("stop", { offset: "62%", "stop-color": "rgba(29,39,51,.16)" }, rg);
        mk("stop", { offset: "100%", "stop-color": "rgba(29,39,51,0)" }, rg);
        var aoC = px((FP.x0 + FP.x1) / 2, (FP.y0 + FP.y1) / 2, 0);
        var ao = mk("ellipse", {
          cx: aoC[0], cy: aoC[1] + 6, rx: (FP.x1 - FP.x0) * U * 0.62, ry: (FP.y1 - FP.y0) * U * 0.34,
          fill: "url(#aoGrad)"
        }, L.ground);
        ao.style.opacity = 0;

        /* ---------- layout: batter boards, strings, flags ---------- */
        var layout = grp({}, L.site), stakes = [], strings = [];
        var CORN = [[FP.x0, FP.y0], [FP.x1, FP.y0], [FP.x1, FP.y1], [FP.x0, FP.y1]];
        CORN.forEach(function (c) {
          var g = grp({}, layout);
          var ox = c[0] === FP.x0 ? -3.5 : 3.5, oy = c[1] === FP.y0 ? -3.5 : 3.5;
          box(g, c[0] + ox - .2, c[1] - .2, 0, .4, .4, 3.6, C.wood);
          box(g, c[0] - .2, c[1] + oy - .2, 0, .4, .4, 3.6, C.wood);
          box(g, c[0] + Math.min(ox, 0) - .2, c[1] + Math.min(oy, 0) - .2, 3.3, Math.abs(ox) + .4, .5, .25, C.wood);
          var fp = px(c[0] + ox, c[1], 3.7);
          mk("polygon", { points: [fp[0] + "," + fp[1], (fp[0] + 9) + "," + (fp[1] + 3), fp[0] + "," + (fp[1] + 6)].join(" "), fill: "#d94a3f" }, g);
          stakes.push(g);
        });
        for (var si = 0; si < 4; si++) {
          var a = CORN[si], b = CORN[(si + 1) % 4], pa = px(a[0], a[1], 3.4), pb = px(b[0], b[1], 3.4);
          var ln = mk("line", { x1: pa[0], y1: pa[1], x2: pb[0], y2: pb[1], stroke: "#d94a3f", "stroke-width": 1.3 }, layout);
          var len = Math.hypot(pb[0] - pa[0], pb[1] - pa[1]);
          ln.style.strokeDasharray = len + " " + len;
          strings.push({ el: ln, len: len });
        }

        /* ---------- site work, revealed at handover ---------- */
        var site2 = grp({}, L.ground);
        var drive = quad(site2, pt(FP.x1 + 1, 30, .02), pt(FP.x1 + 13, 30, .02), pt(FP.x1 + 13, 44, .02), pt(FP.x1 + 1, 44, .02), "#c2c0ba");
        var shrubs = [];
        [[3, 30], [9, 30.5], [15, 30], [26, 30.5], [32, 30], [38, 30.5], [41.5, 22], [41.5, 12]].forEach(function (s) {
          var g = grp({}, site2);
          var c = px(s[0], s[1], 0);
          mk("ellipse", { cx: c[0], cy: c[1], rx: 6, ry: 3, fill: "rgba(29,39,51,.13)" }, g);
          mk("ellipse", { cx: c[0], cy: c[1] - 7, rx: 5.4, ry: 6.4, fill: "#8ea183" }, g);
          mk("ellipse", { cx: c[0] - 1.6, cy: c[1] - 9, rx: 3.2, ry: 3.6, fill: "#9fb094" }, g);
          g.style.opacity = 0;
          shrubs.push(g);
        });
        site2.style.opacity = 1;
        drive.style.opacity = 0;

        /* ---------- the excavation ---------- */
        var PIT = { x0: -1, y0: -1, x1: 41, y1: 29, d: 9 };
        var pitG = grp({}, L.pit);
        var pitFloor = quad(pitG, pt(PIT.x0, PIT.y0, -PIT.d), pt(PIT.x1, PIT.y0, -PIT.d), pt(PIT.x1, PIT.y1, -PIT.d), pt(PIT.x0, PIT.y1, -PIT.d), C.pit.t);
        var pitWallN = quad(pitG, pt(PIT.x0, PIT.y1, 0), pt(PIT.x1, PIT.y1, 0), pt(PIT.x1, PIT.y1, -PIT.d), pt(PIT.x0, PIT.y1, -PIT.d), C.pit.l);
        var pitWallE = quad(pitG, pt(PIT.x1, PIT.y0, 0), pt(PIT.x1, PIT.y1, 0), pt(PIT.x1, PIT.y1, -PIT.d), pt(PIT.x1, PIT.y0, -PIT.d), C.pit.r);

        /* ---------- footing and block courses ---------- */
        var footG = grp({}, L.footing), footings = [];
        WALLS.forEach(function (w) {
          var f = box(footG, place(w, w.from, FTG, w.to - w.from, WT + 1.4, 1)[0],
                            place(w, w.from, FTG, w.to - w.from, WT + 1.4, 1)[1], FTG,
                            place(w, w.from, FTG, w.to - w.from, WT + 1.4, 1)[3],
                            place(w, w.from, FTG, w.to - w.from, WT + 1.4, 1)[4], 1, C.conc);
          footings.push(f);
        });

        var BLK = { len: 2, h: 1.333 }, COURSES = 6, blocks = [];
        WALLS.forEach(function (w) {
          for (var c = 0; c < COURSES; c++) {
            var z = FDN_BOT + c * BLK.h;
            var stagger = (c % 2) * (BLK.len / 2);
            for (var s = w.from + stagger; s < w.to - .2; s += BLK.len) {
              var ln = Math.min(BLK.len - .12, w.to - s - .12);
              if (ln < .5) continue;
              var d = place(w, s, z, ln, WT, BLK.h - .1);
              var g = box(L.cmu, d[0], d[1], d[2], d[3], d[4], d[5], C.cmu, "blk");
              blocks.push({ el: g, course: c, s: s, near: w.near, key: c * 1000 + s });
            }
          }
        });
        blocks.sort(function (a, b) { return a.key - b.key; });

        var slab = box(L.slab, FP.x0 + WT, FP.y0 + WT, -0.5, FP.x1 - FP.x0 - WT * 2, FP.y1 - FP.y0 - WT * 2, .5, C.conc);
        var backfill = [];
        WALLS.forEach(function (w) {
          var d = place(w, w.from, FDN_BOT, w.to - w.from, 2.6, 8);
          backfill.push(box(L.slab, w.axis === "x" ? d[0] : (w.near ? d[0] + WT : d[0] - 1.6),
                            w.axis === "x" ? (w.near ? d[1] + WT : d[1] - 1.6) : d[1],
                            FDN_BOT, d[3], d[4], 8, C.dirt));
        });

        /* ---------- floor systems: rim + joists, per storey ---------- */
        var floorsys = [];
        for (var fl = 0; fl < FLOORS; fl++) {
          var z = Z[fl], g = grp({ class: "flsys" }, L.floorsys), joists = [];
          box(g, FP.x0 + WT, FP.y0 + WT, z - .9, FP.x1 - WT * 2, .8, .9, C.lumber);
          box(g, FP.x0 + WT, FP.y1 - WT - .8, z - .9, FP.x1 - WT * 2, .8, .9, C.lumber);
          for (var jx = FP.x0 + WT + 1; jx < FP.x1 - WT - 1; jx += 1.333) {
            joists.push(box(g, jx, FP.y0 + WT + .8, z - .85, .25, FP.y1 - FP.y0 - WT * 2 - 1.6, .8, C.lumber, "joist"));
          }
          var deck = box(g, FP.x0 + WT, FP.y0 + WT, z - .06, FP.x1 - WT * 2, FP.y1 - FP.y0 - WT * 2, .12, C.sheath);
          floorsys.push({ g: g, joists: joists, deck: deck, z: z });
        }

        /* ---------- wall framing, with real openings ----------
           A stud layout that knows about openings: kings either side, jacks
           inside them carrying a doubled header, a sill and cripples below.
           This is the detail that makes the shell read as the finished
           house rather than a grid of sticks. */
        function studLayout(run0, run1, ops) {
          var out = [], OC = 1.333;
          ops.forEach(function (o) {
            out.push({ pos: o.a - 0.6, role: "king", op: o });
            out.push({ pos: o.a - 0.3, role: "jack", op: o });
            out.push({ pos: o.b + 0.3, role: "jack", op: o });
            out.push({ pos: o.b + 0.6, role: "king", op: o });
          });
          for (var s = run0; s <= run1 - .3; s += OC) {
            var inside = ops.some(function (o) { return s > o.a - 1.0 && s < o.b + 1.0; });
            if (!inside) out.push({ pos: s, role: "stud" });
            else {
              // cripples above the header and below the sill keep the 16" rhythm
              var o = ops.find(function (o) { return s > o.a - 1.0 && s < o.b + 1.0; });
              if (o && s > o.a && s < o.b) {
                out.push({ pos: s, role: "cripple-top", op: o });
                if (!o.door) out.push({ pos: s, role: "cripple-bot", op: o });
              }
            }
          }
          return out;
        }

        var framing = [];
        WALLS.forEach(function (w) {
          for (var fl = 0; fl < FLOORS; fl++) {
            var z = Z[fl], ops = w.op(fl), g = grp({ class: "wall wall-" + w.id }, L.framing), parts = [];
            // plates
            var dp = place(w, w.from, z, w.to - w.from, WT, .3);
            parts.push({ el: box(g, dp[0], dp[1], z, dp[3], dp[4], .3, C.lumber), role: "plate", pos: w.from });
            var dt = place(w, w.from, z + FH - .6, w.to - w.from, WT, .6);
            parts.push({ el: box(g, dt[0], dt[1], z + FH - .6, dt[3], dt[4], .6, C.lumber), role: "plate-top", pos: w.to });
            studLayout(w.from, w.to, ops).forEach(function (s) {
              var zz = z + .3, hh = FH - .9, o = s.op;
              if (s.role === "cripple-top") { zz = z + o.head; hh = FH - .6 - o.head; }
              if (s.role === "cripple-bot") { zz = z + .3; hh = o.sill - .3; }
              if (s.role === "jack") { zz = z + .3; hh = o.head - .3; }
              if (hh <= .15) return;
              var d = place(w, s.pos, zz, s.role === "king" || s.role === "jack" ? .32 : .26, WT, hh);
              var m = s.role === "king" ? C.wood : C.lumber;
              parts.push({ el: box(g, d[0], d[1], zz, d[3], d[4], hh, m, s.role), role: s.role, pos: s.pos });
            });
            ops.forEach(function (o) {
              var dh = place(w, o.a - .3, z + o.head, (o.b - o.a) + .6, WT, .9);
              parts.push({ el: box(g, dh[0], dh[1], z + o.head, dh[3], dh[4], .9, C.wood, "header"), role: "header", pos: o.a });
              if (!o.door) {
                var ds = place(w, o.a - .3, z + o.sill, (o.b - o.a) + .6, WT, .35);
                parts.push({ el: box(g, ds[0], ds[1], z + o.sill, ds[3], ds[4], .35, C.wood, "sill"), role: "sill", pos: o.a });
              }
            });
            parts.sort(function (a, b) { return a.pos - b.pos; });
            framing.push({ g: g, parts: parts, fl: fl, wall: w });
          }
        });

        /* ---------- sheathing, stucco, windows ---------- */
        var sheets = [], stuccoP = [], wins = [];
        WALLS.filter(function (w) { return w.near; }).forEach(function (w) {
          for (var fl = 0; fl < FLOORS; fl++) {
            var z = Z[fl];
            for (var s = w.from; s < w.to - .2; s += 4) {
              var ln = Math.min(4, w.to - s);
              var d = place(w, s, z, ln - .08, .18, FH - .1);
              var off = w.axis === "x" ? [d[0], d[1] + WT - .02] : [d[0] + WT - .02, d[1]];
              sheets.push({ el: box(L.sheath, off[0], off[1], z, d[3], d[4], FH - .1, C.sheath, "sheet"), pos: s, fl: fl });
              var d2 = place(w, s, z, ln - .06, .16, FH - .08);
              var off2 = w.axis === "x" ? [d2[0], d2[1] + WT + .14] : [d2[0] + WT + .14, d2[1]];
              stuccoP.push({ el: box(L.stucco, off2[0], off2[1], z, d2[3], d2[4], FH - .08, C.stucco, "stucco"), pos: s, fl: fl });
            }
            w.op(fl).forEach(function (o) {
              var g = grp({ class: "win" }, L.windows);
              var d = place(w, o.a, z + o.sill, o.b - o.a, .34, o.head - o.sill);
              var off = w.axis === "x" ? [d[0], d[1] + WT - .1] : [d[0] + WT - .1, d[1]];
              box(g, off[0], off[1], z + o.sill, d[3], d[4], o.head - o.sill, C.ink);
              var d3 = place(w, o.a + .35, z + o.sill + .35, o.b - o.a - .7, .1, o.head - o.sill - .7);
              var off3 = w.axis === "x" ? [d3[0], d3[1] + WT + .05] : [d3[0] + WT + .05, d3[1]];

          exc.__load.style.opacity = digT > 0 && digT < 1 ? kf(u, [[0, 0], [.28, 0], [.34, 1], [.66, 1], [.72, 0], [1, 0]]) : 0;

          var tp = px(tX, tY, 0);
          truck.style.transform = "translate(" + tp[0] + "px," + tp[1] + "px)";
          truck.style.opacity = at(p, .142, .168) * (1 - at(p, .262, .275));
          var lvl = digT <= 0 ? 0 : Math.min(1, (ci + (u > .72 ? 1 : u / .72)) / 4);
          truck.__fill.style.opacity = lvl > .02 ? 1 : 0;
          truck.__fill.style.transform = "scaleY(" + Math.max(.02, lvl) + ")";
          truck.__fill.style.transformOrigin = px(0, 0, 2.6)[0] + "px " + px(0, 0, 2.6)[1] + "px";
          W.digger.style.opacity = at(p, .145, .175) * (1 - at(p, .235, .265));
          W.digger.__arm.style.transform = "rotate(" + (Math.sin(p * 240) * 18 - 30) + "deg)";

          pitG.style.opacity = at(p, .148, .168);
          [pitWallN, pitWallE].forEach(function (w) { w.style.opacity = depth; });
          pitG.style.transform = "scaleY(" + (.06 + .94 * depth) + ")";
          pitG.style.transformOrigin = px(PIT.x0, PIT.y1, 0)[0] + "px " + px(PIT.x0, PIT.y1, 0)[1] + "px";

          /* ---- 3 foundation: footing, then blocks laid course by course ---- */
          footings.forEach(function (f, i) { var t = at(p, .238 + i * .006, .262 + i * .006); f.style.opacity = t; growUp(f, t); });
          seq(blocks, .258, .352, .90, function (b, t) {
            b.el.style.opacity = t > .02 ? 1 : 0;
            b.el.style.transform = "translateY(" + (1 - back(cl(t))) * -11 + "px)";
          });
          W.mason.style.opacity = at(p, .252, .272) * (1 - at(p, .348, .372));
          W.mason.__arm.style.transform = "rotate(" + (Math.sin(p * 420) * 40 - 26) + "deg)";
          var mx = kf(at(p, .26, .35), [[0, 0], [1, 1]]);
          W.mason.style.transform = "translate(" + (-mx * 120) + "px," + (mx * 32) + "px)";
          backfill.forEach(function (b, i) { var t = at(p, .352 + i * .004, .378 + i * .004); b.style.opacity = t; growUp(b, t); });
          slab.style.opacity = at(p, .360, .380);

          /* ---- 4 framing: floor systems then walls, storey by storey ---- */
          floorsys.forEach(function (f, k) {
            var a0 = .385 + k * .052, b0 = a0 + .030;
            seq(f.joists, a0, b0, .86, function (j, t) { riseIn(j, t, 12); });
            f.deck.style.opacity = at(p, b0 + .004, b0 + .016);
          });
          framing.forEach(function (fw) {
            var a0 = .400 + fw.fl * .052 + (fw.wall.near ? .008 : 0), b0 = a0 + .040;
            seq(fw.parts, a0, b0, .88, function (part, t) {
              part.el.style.opacity = t > .02 ? 1 : 0;
              part.el.style.transform = "scaleY(" + o3(cl(t)) + ")";
            });
          });
          // the shadow deepens as the mass goes up
          ao.style.opacity = kf(at(p, .360, .580), [[0, 0], [1, 1]]) * (1 - at(p, .700, .724) * .55) +
                             at(p, .930, .958) * .55;
          W.framer.style.opacity = at(p, .402, .424) * (1 - at(p, .560, .582));
          W.framer.__arm.style.transform = "rotate(" + (Math.sin(p * 560) * 42 - 28) + "deg)";
          var frx = kf(at(p, .41, .56), [[0, 0], [1, 1]]);
          W.framer.style.transform = "translate(" + (-frx * 90) + "px," + (-frx * 26) + "px)";

          roof.style.opacity = at(p, .556, .578); growUp(roof, at(p, .556, .578));
          parapet.style.opacity = at(p, .572, .590);

          /* ---- 5 exterior: sheathing, windows, stucco ---- */
          seq(sheets, .586, .626, .88, function (s, t) { riseIn(s.el, t, 10); });
          seq(wins, .624, .656, .84, function (w, t) {
            w.el.style.opacity = t > .02 ? 1 : 0;
            w.el.style.transform = "scale(" + Math.max(0, back(cl(t))) + ")";
            w.el.style.transformOrigin = px(w.pos, FP.y1, Z[w.fl] + 5)[0] + "px " + px(w.pos, FP.y1, Z[w.fl] + 5)[1] + "px";
          });
          W.glazier.style.opacity = at(p, .618, .636) * (1 - at(p, .652, .668));
          W.glazier.__arm.style.transform = "rotate(" + (Math.sin(p * 300) * 30 - 34) + "deg)";
          seq(stuccoP, .648, .700, .90, function (s, t) { s.el.style.opacity = t; });
          W.plasterer.style.opacity = at(p, .644, .662) * (1 - at(p, .700, .716));
          W.plasterer.__arm.style.transform = "rotate(" + (Math.sin(p * 500) * 44 - 16) + "deg)";
          var plx = kf(at(p, .65, .70), [[0, 0], [1, 1]]);
          W.plasterer.style.transform = "translate(" + plx * 150 + "px," + plx * 40 + "px)";

          /* ---- cutaway: the near walls step back so the camera can get in ---- */
          var cut = at(p, .690, .716) * (1 - at(p, .930, .952));
          [L.stucco, L.sheath, L.windows].forEach(function (g) { g.style.opacity = 1 - cut * .93; });
          var nearWalls = framing.filter(function (f) { return f.wall.near; });
          nearWalls.forEach(function (f) { f.g.style.opacity = 1 - cut * .72; });
          L.roof.style.opacity = 1 - cut * .88;

          /* ---- 6 services, insulation, board, floor, paint ---- */
          ipart.forEach(function (g) { g.style.opacity = at(p, .700, .722); });
          pipeEls.forEach(function (w) { var t = at(p, .716, .744); w.el.style.strokeDashoffset = (1 - o3(t)) * w.len; w.el.style.opacity = t > 0 ? 1 : 0; });
          wireEls.forEach(function (w) { var t = at(p, .730, .762); w.el.style.strokeDashoffset = (1 - o3(t)) * w.len; w.el.style.opacity = t > 0 ? 1 : 0; });
          seq(boxes, .736, .758, .6, function (b, t) { b.style.opacity = t > .02 ? 1 : 0; b.style.transform = "scale(" + Math.max(0, back(cl(t))) + ")"; });
          W.sparky.style.opacity = at(p, .706, .724) * (1 - at(p, .762, .778));
          W.sparky.__arm.style.transform = "rotate(" + (Math.sin(p * 460) * 36 - 40) + "deg)";

          seq(batts, .766, .808, .88, function (b, t) { b.style.opacity = t; b.style.transform = "scaleY(" + o3(cl(t)) + ")"; });
          seq(gyp, .812, .846, .82, function (g, t) { riseIn(g, t, 9); });
          seq(screws, .822, .858, .93, function (sc, t) { sc.el.style.opacity = t; });
          W.taper.style.opacity = at(p, .808, .826) * (1 - at(p, .856, .872));
          W.taper.__arm.style.transform = "rotate(" + (Math.sin(p * 520) * 40 - 22) + "deg)";
          seq(tiles, .852, .896, .92, function (tl, t) { tl.el.style.opacity = t > .02 ? 1 : 0; tl.el.style.transform = "scale(" + Math.max(0, back(cl(t))) + ")"; });

          seq(painted, .898, .936, .84, function (pf, t) { pf.style.opacity = t; });
          W.painter.style.opacity = at(p, .892, .910) * (1 - at(p, .938, .952));
          W.painter.__arm.style.transform = "rotate(" + (Math.sin(p * 380) * 48 - 30) + "deg)";
          walkG.style.opacity = at(p, .930, .958);
          drive.style.opacity = at(p, .936, .962);
          seq(shrubs, .944, .980, .7, function (g, t) {
            g.style.opacity = t; g.style.transform = "scale(" + Math.max(0, back(cl(t))) + ")";
            g.style.transformOrigin = "center";
          });
          doorG.style.opacity = at(p, .636, .660) * (1 - cut * .93);

          /* ---- 7 handover: the lights go on ----
             A warm pane sits over the cold one and is faded up, rather than
             swapping a fill, so it crossfades instead of snapping. */
          var lit = at(p, .944, .992);
          wins.forEach(function (w, i) {
            w.lit.style.opacity = lit * (i === 0 ? 1 : kf(cl((lit * 1.5) - i * 0.06), [[0, 0], [1, 1]]));
          });

          readout.textContent = "p " + p.toFixed(3) + "   ·   " + beatName(p);
        }

        var BEATS = [
          ["Empty lot", .004], ["String lines", .062], ["Excavator in", .118], ["Digging", .175],
          ["Truck loading", .205], ["Footings", .245], ["Block courses", .300], ["Backfill + slab", .366],
          ["Floor joists", .400], ["Framing rises", .470], ["Roof on", .570], ["Sheathing", .600],
          ["Windows in", .638], ["Stucco", .672], ["Rough-in", .740], ["Insulation", .786],
          ["Drywall", .830], ["Flooring", .872], ["Paint", .906], ["Finished", .980]
        ];
        function beatName(p) { var n = BEATS[0][0]; for (var i = 0; i < BEATS.length; i++) if (p >= BEATS[i][1] - .004) n = BEATS[i][0]; return n; }

        /* ---------- harness ---------- */
        var scrub = document.getElementById("scrub"), readout = document.getElementById("readout"), playBtn = document.getElementById("play");
        var raf = null, playing = false;
        scrub.addEventListener("input", function () { stop(); paint(+scrub.value / 1000); });
        function step() { var v = +scrub.value + .9; if (v > 1000) v = 0; scrub.value = String(v); paint(v / 1000); raf = requestAnimationFrame(step); }
        function start() { if (playing) return; playing = true; playBtn.textContent = "Pause"; playBtn.setAttribute("aria-pressed", "true"); raf = requestAnimationFrame(step); }
        function stop() { playing = false; playBtn.textContent = "Play"; playBtn.setAttribute("aria-pressed", "false"); if (raf) cancelAnimationFrame(raf); raf = null; }
        playBtn.addEventListener("click", function () { playing ? stop() : start(); });
        var beatsRow = document.getElementById("beats");
        BEATS.forEach(function (b) { var x = document.createElement("button"); x.textContent = b[0]; x.addEventListener("click", function () { stop(); scrub.value = String(Math.round(b[1] * 1000)); paint(b[1]); }); beatsRow.appendChild(x); });
        var FR = [["Desktop", 900, 560], ["Laptop", 760, 470], ["Phone", 390, 300], ["9:16", 405, 720]];
        var framesRow = document.getElementById("frames");
        function setFrame(w, h) { VW = w; VH = h; scene.setAttribute("width", w); scene.setAttribute("height", h); paint(+scrub.value / 1000); }
        FR.forEach(function (f, i) {
          var b = document.createElement("button"); b.textContent = f[0]; b.setAttribute("aria-pressed", String(i === 0));
          b.addEventListener("click", function () { [].forEach.call(framesRow.children, function (c) { c.setAttribute("aria-pressed", "false"); }); b.setAttribute("aria-pressed", "true"); setFrame(f[1], f[2]); });
          framesRow.appendChild(b);
        });
        window.__build = { paint: paint, beats: BEATS, counts: { blocks: blocks.length, joists: floorsys.reduce(function (n, f) { return n + f.joists.length; }, 0), framing: framing.reduce(function (n, f) { return n + f.parts.length; }, 0), sheets: sheets.length, wins: wins.length, batts: batts.length, gyp: gyp.length, tiles: tiles.length } };
        setFrame(900, 560); paint(0);
      })();
    </script>
  </body>
</html>
